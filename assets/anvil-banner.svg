<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Anvil Studio</title>
  <desc id="description">Put your enchantments in order. A Minecraft enchantment planner for Java and Bedrock, illustrated with books and a helmet leading to an anvil.</desc>
  <!-- Original layout: MIT. Embedded Minecraft artwork: see dist/assets/CREDITS.md. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101713"/><stop offset="1" stop-color="#19231b"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#b6ed86" stop-opacity=".09"/><stop offset="1" stop-color="#b6ed86" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b6ed86" opacity=".1"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#354535"/>
  <rect x="700" y="18" width="560" height="324" fill="url(#grid)"/>
  <ellipse cx="1050" cy="190" rx="330" ry="180" fill="url(#glow)"/>
  <rect x="64" y="54" width="5" height="22" rx="2" fill="#b6ed86"/>
  <text x="82" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.4" fill="#aebda6">MINECRAFT ENCHANTMENT PLANNER</text>
  <text x="61" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.8" fill="#f0f5ea">Anvil <tspan fill="#b6ed86">Studio</tspan></text>
  <text x="65" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#c0cdb8">Put your enchantments in order.</text>
  <rect x="65" y="246" width="147" height="34" rx="7" fill="#243520" stroke="#405637"/>
  <text x="138.5" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#d7ecc4">JAVA + BEDROCK</text>
  <text x="231" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fab96">Anvil steps, costs and a plan you can follow.</text>
  <path d="M940 99 C1000 99 990 182 1038 182 M930 260 C986 260 990 208 1038 208" fill="none" stroke="#597348" stroke-width="2.5"/>
  <circle cx="1038" cy="182" r="4" fill="#b6ed86"/><circle cx="1038" cy="208" r="4" fill="#b6ed86"/>
  <rect x="780" y="60" width="160" height="78" rx="12" fill="#292331" stroke="#675279"/>
